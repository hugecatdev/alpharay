[project]
name = "alpharay-backend"
version = "0.1.0"
description = "AlphaRay — бэкенд умного кредитного кабинета"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.157.0,<0.158.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-multipart (>=0.0.32,<0.1.0)",
    "tzdata (>=2026.5)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "^0.17.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:.*httpx2.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
